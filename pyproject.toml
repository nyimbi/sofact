[project]
name = "sofact"
version = "0.1.0"
description = "SoFact — an intent-to-platform software factory. Elicit a goal, compile it into a falsifiable contract, and verify the result independently of whoever produced it."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Nyimbi Odero", email = "nyimbi@gmail.com" }]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Programming Language :: Python :: 3.13",
	"Topic :: Software Development :: Quality Assurance",
]
dependencies = [
	"httpx>=0.27",
	"pydantic>=2.12,<3",
	"textual>=8.0",
	"typer>=0.12",
	"uuid6>=2024.7.10",
]

[project.scripts]
sofact = "sofact.cli:main"

[project.urls]
Homepage = "https://github.com/nyimbi/sofact"

[dependency-groups]
dev = [
	"pytest>=8.0",
	"pytest-asyncio>=0.24",
	"pytest-httpserver>=1.1",
	"pyright>=1.1.390",
	"ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sofact"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/ci"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "A", "C4", "RET", "SIM", "TID", "RUF"]
ignore = [
	"E501",  # line length is enforced by the formatter, not the linter
	"W191",  # tabs are the project convention (see ADR-0002); ruff's warning is not applicable
	# RUF001 and RUF002 are the same finding on a string and on a docstring, and the
	# comment here named only the first while the intent covered both. The en-dash in
	# `FR-024–FR-035` is the spec's own spelling (70 uses in product-spec.md, 8 in
	# views.py), so ignoring one of the two rules left the house style failing a lint in
	# the one place it happened to land in a function docstring.
	"RUF001",
	"RUF002",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# pyright is configured by pyrightconfig.json, which pyright prefers over this file.
# Keeping a second copy here was dead config and drifted (it said 3.12 while the real
# config said 3.13) — a setting that looks authoritative and is not is worse than no
# setting at all. One source of truth per tool.
